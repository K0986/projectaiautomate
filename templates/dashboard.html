{% extends 'base.html' %}
{% block content %}
<section class="dashboard">
  <div class="dashboard-top"><p class="eyebrow">YOUR ACCOUNT</p><form method="post" action="{{ url_for('logout') }}">{{ logout_form.hidden_tag() }}<button class="secondary-button" type="submit">Sign out</button></form></div>
  <span class="status"><span aria-hidden="true"></span>Signed in</span>
  <h1>Welcome home,<br><span class="username">{{ g.user['username'] }}.</span></h1>
  <p class="intro">Good to have you here.</p>
  <dl class="account-details"><div><dt>Username</dt><dd>{{ g.user['username'] }}</dd></div><div><dt>Member since</dt><dd>{{ g.user['created_at'][:10] }}</dd></div><div><dt>Account status</dt><dd>Active</dd></div></dl>
  <img class="dashboard-photo" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=85" alt="A sunlit mountain peak beneath a blue sky">
</section>
{% endblock %}
